[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[project]
name = "agentic-orchestration"
version = "0.1.0"
description = "Production-grade multi-framework agentic orchestration system combining LangGraph, PydanticAI, and DSPy."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "typing-extensions>=4.10.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# Framework dependency placeholders for upcoming phases
langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]
pydantic-ai = [
    "pydantic-ai>=0.0.14",
]
dspy = [
    "dspy-ai>=2.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dspy", "dspy.*", "app.dspy_lab.*"]
disallow_subclassing_any = false
ignore_missing_imports = true

